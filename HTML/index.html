<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทะเบียนนักศึกษา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #15232e;
    --muted: #5a6b78;
    --line: #cdd6dd;
    --accent: #0b6e6e;
    --accent-ink: #ffffff;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11191f;
      --surface: #1a252d;
      --ink: #e7eef3;
      --muted: #94a5b1;
      --line: #2f3e49;
      --accent: #3fb5b5;
      --accent-ink: #08201f;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  form {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 14px;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .6; cursor: progress; }

  #status { min-height: 1.6em; margin: 0 0 12px; color: var(--muted); }
  #status.error { color: var(--danger); }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th { font-weight: 500; color: var(--muted); font-size: .9rem; }
  tr:last-child td { border-bottom: 0; }
  td.row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  td.row-actions button { padding: 4px 10px; font-size: .9rem; }
  .empty { padding: 24px 14px; color: var(--muted); }

  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>ทะเบียนนักศึกษา</h1>
  <p class="sub">เพิ่ม ดู แก้ไข และลบรายชื่อ ข้อมูลเก็บใน Azure SQL Database</p>

  <form id="form">
    <div>
      <label for="name">ชื่อ-นามสกุล</label>
      <input id="name" maxlength="100" required autocomplete="off">
    </div>
    <div>
      <label for="email">อีเมล</label>
      <input id="email" type="email" maxlength="100" autocomplete="off">
    </div>
    <div class="actions">
      <button type="submit" id="save" class="primary">เพิ่มรายชื่อ</button>
      <button type="button" id="cancel" hidden>ยกเลิกการแก้ไข</button>
    </div>
  </form>

  <p id="status" role="status"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ชื่อ-นามสกุล</th><th>อีเมล</th><th><span class="sr-only"></span></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>ยังไม่มีรายชื่อ กรอกฟอร์มด้านบนเพื่อเพิ่มรายชื่อแรก</div>
  </div>
</main>

<script>
  const API = "/api/students";
  const form = document.getElementById("form");
  const nameEl = document.getElementById("name");
  const emailEl = document.getElementById("email");
  const saveBtn = document.getElementById("save");
  const cancelBtn = document.getElementById("cancel");
  const rowsEl = document.getElementById("rows");
  const emptyEl = document.getElementById("empty");
  const statusEl = document.getElementById("status");

  let editingId = null;

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  async function request(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).error || ""; } catch (_) {}
      throw new Error(detail || "เกิดข้อผิดพลาด (" + res.status + ")");
    }
    return res.status === 204 ? null : res.json();
  }

  async function load() {
    setStatus("กำลังโหลดข้อมูล ถ้าฐานข้อมูลเพิ่งตื่น อาจใช้เวลาถึง 1 นาที");
    try {
      const students = await request(API);
      render(students);
      setStatus("");
    } catch (err) {
      setStatus("โหลดข้อมูลไม่ได้: " + err.message, true);
    }
  }

  function cell(text) {
    const td = document.createElement("td");
    td.textContent = text || "";
    return td;
  }

  function render(students) {
    rowsEl.replaceChildren();
    emptyEl.hidden = students.length > 0;
    for (const s of students) {
      const tr = document.createElement("tr");
      tr.append(cell(s.Name), cell(s.Email));

      const actions = document.createElement("td");
      actions.className = "row-actions";

      const edit = document.createElement("button");
      edit.textContent = "แก้ไข";
      edit.addEventListener("click", () => startEdit(s));

      const del = document.createElement("button");
      del.textContent = "ลบ";
      del.className = "danger";
      del.addEventListener("click", () => remove(s));

      actions.append(edit, del);
      tr.append(actions);
      rowsEl.append(tr);
    }
  }

  function startEdit(s) {
    editingId = s.Id;
    nameEl.value = s.Name;
    emailEl.value = s.Email || "";
    saveBtn.textContent = "บันทึกการแก้ไข";
    cancelBtn.hidden = false;
    nameEl.focus();
  }

  function resetForm() {
    editingId = null;
    form.reset();
    saveBtn.textContent = "เพิ่มรายชื่อ";
    cancelBtn.hidden = true;
  }

  cancelBtn.addEventListener("click", resetForm);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = JSON.stringify({ name: nameEl.value.trim(), email: emailEl.value.trim() });
    const headers = { "Content-Type": "application/json" };
    saveBtn.disabled = true;
    try {
      if (editingId === null) {
        await request(API, { method: "POST", headers, body });
        setStatus("เพิ่มรายชื่อแล้ว");
      } else {
        await request(API + "/" + editingId, { method: "PUT", headers, body });
        setStatus("บันทึกการแก้ไขแล้ว");
      }
      resetForm();
      const students = await request(API);
      render(students);
    } catch (err) {
      setStatus("บันทึกไม่ได้: " + err.message, true);
    } finally {
      saveBtn.disabled = false;
    }
  });

  async function remove(s) {
    if (!confirm("ลบ " + s.Name + " ใช่ไหม")) return;
    try {
      await request(API + "/" + s.Id, { method: "DELETE" });
      setStatus("ลบรายชื่อแล้ว");
      if (editingId === s.Id) resetForm();
      render(await request(API));
    } catch (err) {
      setStatus("ลบไม่ได้: " + err.message, true);
    }
  }

  load();
</script>
</body>
</html>
